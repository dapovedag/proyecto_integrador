# API de riesgo de crédito v2 · `docker compose up --build` → http://127.0.0.1:8000/docs
services:
  api:
    build: .
    image: riesgo-credito-api:2.0.0
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      - LOG_LEVEL=info
      - CORS_ORIGINS=http://127.0.0.1:5180,http://localhost:5180
    read_only: true
    tmpfs:
      - /tmp
    restart: unless-stopped
