[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "credit-risk"
dynamic = ["version"]
description = "Proyecto Integrador: análisis predictivo de riesgo de crédito (paquete único de datos, modelos, equidad y explicación)."
readme = "README.md"
requires-python = ">=3.10,<3.13"
# Núcleo mínimo: lo que necesitan la API y train.py. Lo pesado va en extras.
dependencies = [
    "numpy==1.26.4",
    "pandas==2.3.3",
    "scipy==1.15.3",
    "scikit-learn==1.4.2",
    "joblib==1.3.2",
    "pydantic>=2.10,<3",
]

[project.optional-dependencies]
api = [
    "fastapi==0.115.12",
    "uvicorn[standard]==0.34.0",
]
nb = [
    "jupyterlab>=4.3",
    "ipykernel>=6.29",
    "papermill>=2.6",
    "nbconvert>=7.16",
    "nbformat>=5.10",
    "matplotlib>=3.9",
    "seaborn==0.13.2",
    "plotnine>=0.14",
    "duckdb>=1.1",
    "pyarrow>=17",
    "shap==0.46.0",
    "requests>=2.32",
]
dl = [
    "tensorflow==2.20.0",
]
nlp = [
    "torch>=2.5",
    "transformers>=4.46",
    "sentence-transformers>=3.3",
]
spark = [
    # Se ejecuta dentro de Docker (quay.io/jupyter/pyspark-notebook:2026-10-19, Spark 4.2). Ver ADR-005.
    "pyspark==4.2.0",
]
dev = [
    "pytest>=8.3",
    "pytest-cov>=5",
    "httpx>=0.27",
    "ruff>=0.8",
    "mypy>=1.13",
    "pyyaml>=6",
]

[tool.setuptools.dynamic]
version = { attr = "credit_risk.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
addopts = "-q"
markers = [
    "slow: pruebas que entrenan modelos (se excluyen con -m 'not slow')",
]

[tool.coverage.run]
source = ["credit_risk", "api"]
omit = [
    "src/credit_risk/dl.py",
    "src/credit_risk/nlp_avanzado.py",
    "src/credit_risk/notebook.py",
    "src/credit_risk/reporting.py",
]

[tool.ruff]
line-length = 120
target-version = "py310"
extend-exclude = ["notebooks", ".venv"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "N"]
ignore = ["N803", "N806", "SIM905"]  # X, X_train son convención en ML; listas de palabras con split

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["credit_risk.models.Costos"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
warn_unused_ignores = true
check_untyped_defs = true
