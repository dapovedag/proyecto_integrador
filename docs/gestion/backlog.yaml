      - Back/src/credit_risk/config.py
      - Back/src/credit_risk/data.py
      - Back/src/credit_risk/features.py
      - Back/src/credit_risk/models.py
      - Back/tests/test_data.py
      - Back/tests/test_models.py

  - id: HU-14
    epica: E-09
    rol: científico de datos
    quiero: probar el entorno (TensorFlow, torch, PySpark en Docker) antes de escribir notebooks
    para: no descubrir bloqueos de dependencias al final del sprint
    criterios_aceptacion:
      - dado: Back/.venv con Python 3.10
        cuando: se importan tensorflow, sklearn y torch en ambos órdenes
