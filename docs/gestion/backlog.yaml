    puntos: 3
    sprint: S5
    estado: Hecho
    paso: 2
    ids_enunciado: [P1.1, P1.2]
    evidencia:
      - docs/gestion/adr/ADR-005-pyspark-en-docker.md
      - docs/gestion/adr/ADR-006-tensorflow-2-20-cpu.md
      - docs/gestion/adr/ADR-008-python-3-10-sklearn-1-4-2.md
      - Back/requirements-api.lock
      - Back/requirements-dev-win.lock

  - id: HU-15
    epica: E-01
    rol: equipo del proyecto
    quiero: que la DoD de los notebooks se verifique con un script
