# Backlog del producto: FUENTE ÚNICA.
# backlog.md, trazabilidad.md, el checklist de 01_enunciado.md y Front/src/data/generated/gestion.json
# se generan desde aquí con:  python Back/scripts/generar_evidencia.py
#
# Convenciones
# - estado: Pendiente | En progreso | En revisión | Hecho  (Hecho exige cumplir definicion_de_hecho.md)
# - puntos: Fibonacci (1, 2, 3, 5, 8, 13). null = "no estimado" (solo para el trabajo del MVP, S1–S4).
# - sprint: sprint en el que la historia está comprometida hoy; null = backlog del producto (sin sprint ni paso).
#   sprint_mvp: sprint del MVP donde se intentó.
# - evidencia: rutas relativas a la raíz del repositorio. Una historia solo cuenta como acreditada
#   si está en "Hecho" Y todas sus rutas existen (y, si hay dod_status.json, sus notebooks cumplen la DoD).
# - Las historias HU-00…HU-12 vienen del MVP. La auditoría QA (report_qa.md, 2026-10-16) mostró que
#   ninguna cumplía su criterio de hecho con evidencia; volvieron al backlog y se re-estimaron para v2.

proyecto: Análisis predictivo de riesgo de crédito
version_modelo_objetivo: "2.0.0"
metodologia:
  gestion: Scrum
  ciclo_analitico: CRISP-DM
  practicas: MLOps
  fases_crisp_dm:
    F1: Business Understanding
    F2: Data Understanding + Data Preparation
    F3: Modeling
    F4: Evaluation
    F5: Deployment

sprints:
  - id: S1
    nombre: Problema y datos entendidos (MVP)
    inicio: "2026-10-09"
    fin: "2026-10-16"
    objetivo: Problema definido y datos explorados.
    fase: [F1, F2]
    nota: Ventana compartida S1–S4; no se registraron fechas ni puntos por sprint.
  - id: S2
    nombre: Datos listos (MVP)
    inicio: "2026-10-09"
    fin: "2026-10-16"
    objetivo: Datos limpios y EDA avanzado.
    fase: [F2]
    nota: Ventana compartida S1–S4.
  - id: S3
    nombre: Modelado (MVP)
    inicio: "2026-10-09"
    fin: "2026-10-16"
    objetivo: Modelos clásicos, redes, NLP y evaluación.
    fase: [F3, F4]
    nota: Ventana compartida S1–S4.
  - id: S4
    nombre: Despliegue (MVP)
    inicio: "2026-10-09"
    fin: "2026-10-16"
    objetivo: Spark, API, integrador y ejecución local.
    fase: [F5]
    nota: Ventana compartida S1–S4.
  - id: S5
    nombre: Fundaciones
    inicio: "2026-10-23"
    fin: "2026-10-23"
    objetivo: >-
      Entorno probado y un único paquete credit_risk con tests, DoD automatizada y gestión
      verificable (backlog único, DoR, DoD multinivel, ADRs, trazabilidad calculada).
    fase: [F2, F3]
    burndown: git
    nota: Ejecutado en una ventana comprimida el 2026-10-23 (rama feat/v2-senior); el burndown se calcula desde los commits que citan cada HU.
  - id: S6
    nombre: Datos y modelado
    inicio: "2026-10-23"
    fin: "2026-10-23"
    objetivo: >-
      Notebooks 01–07 y 09 reescritos sobre credit_risk y ejecutados con papermill (kernel
      credit-risk), con sus artefactos y conclusiones redactadas después de ver las salidas.
    fase: [F1, F2, F3]
    burndown: git
    nota: Ejecutado en una ventana comprimida el 2026-10-23 (rama feat/v2-senior); el burndown se calcula desde los commits que citan cada HU.
  - id: S7
    nombre: Modelo v2.0.0
    inicio: "2026-10-23"
    fin: "2026-10-23"
    objetivo: >-
      Modelo v2.0.0 seleccionado sin fuga, calibrado, con política aprobar/revisar/rechazar,
      equidad evaluada y servido por la API v2 en Docker; paquete de corrida exportado.
    fase: [F4, F5]
    burndown: git
    nota: Ejecutado en una ventana comprimida el 2026-10-23 (rama feat/v2-senior); el burndown se calcula desde los commits que citan cada HU.
  - id: S8
    nombre: Producto y comunicación
    inicio: "2026-10-23"
    fin: "2026-10-23"
    objetivo: >-
      Front estático autónomo con un capítulo por entregable y motor exacto, documentación
      coherente con v2.0.0 y checklist del enunciado acreditado por cálculo.
    fase: [F5]
    burndown: git
    nota: Ejecutado en una ventana comprimida el 2026-10-23 (rama feat/v2-senior); el burndown se calcula desde los commits que citan cada HU.

epicas:
  - id: E-01
    nombre: Gestión ágil y gobierno del proyecto
    objetivo: Scrum aplicado de verdad, con artefactos verificables y trazabilidad calculada.
  - id: E-02
    nombre: Comprensión del negocio y ética (F1)
    objetivo: Problema de impago formulado con métricas de negocio y riesgos éticos explícitos.
  - id: E-03
    nombre: Datos (F2)
    objetivo: Datos explorados, validados y preparados con un pipeline único y sin fuga.
  - id: E-04
    nombre: Modelado (F3)
    objetivo: Modelos clásicos, redes neuronales y NLP entrenados y comparados con evidencia ejecutada.
  - id: E-05
    nombre: Evaluación, política de decisión y equidad (F4)
    objetivo: Un modelo v2.0.0 seleccionado sin usar test, calibrado, con costos explícitos y auditado en equidad.
  - id: E-06
    nombre: Big Data
    objetivo: Procesamiento y modelado con PySpark real.
  - id: E-07
    nombre: Despliegue del modelo (F5)
    objetivo: API REST del modelo servido, en Docker, reproducible desde un clon limpio.
  - id: E-08
    nombre: Integración y comunicación (F5)
    objetivo: Notebook integrador, informe y documentación coherentes con v2.0.0.
  - id: E-09
    nombre: Plataforma y calidad
    objetivo: Paquete instalable como fuente única, tests, gate de calidad y ejecución reproducible.
  - id: E-10
    nombre: Front estático autónomo
    objetivo: Sitio estático que muestra los resultados reales y simula la corrida con fidelidad, sin back.

historias:
  # ---------------------------------------------------------------- HU del MVP (re-trabajo en v2)
  - id: HU-00
    epica: E-01
    rol: equipo del proyecto
    quiero: un backlog único, sprints con objetivo, DoR y DoD verificables, ADRs y retrospectivas
    para: gestionar el proyecto con Scrum y poder demostrarlo con evidencia
    criterios_aceptacion:
      - dado: el archivo docs/gestion/backlog.yaml
        cuando: se ejecuta python Back/scripts/generar_evidencia.py
        entonces: se generan backlog.md, trazabilidad.md, el checklist de 01_enunciado.md y gestion.json sin errores
      - dado: cada paso 0–12 del plan
        cuando: se revisa trazabilidad.md
        entonces: cada paso y cada ID del enunciado tienen al menos una historia
      - dado: un sprint cerrado
        cuando: se lee sprints.md
        entonces: tiene review, retrospectiva y burndown con datos reales
    puntos: 5
    sprint: S5
    sprint_mvp: S1
    estado: Hecho
    paso: 0
    ids_enunciado: [E1, R3]
    evidencia:
      - docs/gestion/backlog.yaml
      - docs/gestion/definicion_de_hecho.md
      - docs/gestion/definicion_de_listo.md
      - docs/gestion/sprints.md
      - docs/gestion/riesgos.md
      - docs/gestion/trazabilidad.md
    nota: En el MVP se marcó Hecho con retros vacías y estados desactualizados (QA, paso 0).

  - id: HU-01
    epica: E-02
    rol: analista de crédito
    quiero: el problema de impago definido con métricas de negocio y riesgos éticos
    para: confiar en el uso del modelo y conocer sus límites
    criterios_aceptacion:
      - dado: el notebook 01 ejecutado con papermill
        cuando: se ejecuta verificar_dod.py
        entonces: el notebook cumple todos los criterios de nivel notebook
      - dado: el notebook 01
        cuando: se lee
        entonces: tiene Contexto, Formulación, Datasets, Métricas, Ética y Conclusión, y la tabla de variables sensibles que reutiliza el paso 8
    puntos: 3
    sprint: S6
    sprint_mvp: S1
    estado: Hecho
    paso: 1
    ids_enunciado: [IA1.1, IA1.3, E5, F1]
    evidencia:
      - Back/notebooks/01_definicion_problema_etica.ipynb
      - Back/reports/dod_status.json
    nota: Contenido documental existente; no importa credit_risk ni corre con el kernel credit-risk.

  - id: HU-02
    epica: E-03
    rol: científico de datos
    quiero: explorar el dataset con el entorno, las librerías y operaciones básicas
    para: entender su estructura y calidad antes de prepararlo
    criterios_aceptacion:
      - dado: el notebook 02 ejecutado
        cuando: se revisa
        entonces: incluye configuración del entorno (celda IN_COLAB), librerías, inspección, filtrado, selección, ordenamiento y agregaciones (pandas y DuckDB)
      - dado: el notebook 02
        cuando: se cuentan sus figuras
        entonces: hay al menos 3 histogramas, 2 dispersiones y 3 boxplots, cada uno con interpretación
    puntos: 3
    sprint: S6
    sprint_mvp: S1
    estado: Hecho
    paso: 2
    ids_enunciado: [P1.1, P1.2, P1.3, P1.4, P1.5, P1.E1, P1.E2, P1.E3, P1.E4, E3]
    evidencia:
      - Back/notebooks/02_exploracion_preliminar.ipynb
      - docs/03_contrato_datos.md
      - Back/reports/dod_status.json

  - id: HU-03
    epica: E-03
    rol: científico de datos
    quiero: limpiar y preparar los datos con el pipeline del paquete
    para: entrenar sin fuga y con las mismas transformaciones que se sirven
    criterios_aceptacion:
      - dado: credit_risk.features
        cuando: se ajusta el preprocesador
        entonces: usa las 6 variables derivadas, ordinal para nivel_educativo y rango_edad y winsorizer p1–p99 ajustado solo en train
      - dado: el notebook 03 ejecutado
        cuando: se revisan db/processed
        entonces: existen train.csv, test.csv y feature_list.json sin nulos ni duplicados, con su SHA-256
    puntos: 5
    sprint: S6
    sprint_mvp: S2
    estado: Hecho
    paso: 3
    ids_enunciado: [P2.1, P2.2, P2.3, P2.4, P2.5, P2.6, P2.E1, P2.E2, P2.E3, P2.E4, F2]
    evidencia:
      - Back/notebooks/03_limpieza_preparacion.ipynb
      - Back/src/credit_risk/features.py
      - Back/tests/test_features.py
      - db/processed/train.csv
      - db/processed/test.csv
      - db/processed/feature_list.json
    nota: En el MVP features.py divergía de nb03 (3 variables, one-hot, sin capping).

  - id: HU-04
    epica: E-03
    rol: analista de crédito
    quiero: ver los patrones, correlaciones y variables que más influyen en el impago
    para: entender los factores de riesgo
    criterios_aceptacion:
      - dado: el notebook 04 ejecutado
        cuando: se revisa
        entonces: tiene Matplotlib, Seaborn y plotnine, atípicos antes/después, PCA con varianza explicada y proyección 2D, y tabla final de variables relevantes
      - dado: cada figura del notebook 04
        cuando: se ejecuta verificar_dod.py
        entonces: figuras_interpretadas es verdadero
    puntos: 8
    sprint: S6
    sprint_mvp: S2
    estado: Hecho
    paso: 4
    ids_enunciado: [IA1.2, IA1.E1, IA1.E2, IA2.2, IA2.4, IA2.5, IA2.E1, IA2.E2, F2, R2]
    evidencia:
      - Back/notebooks/04_eda_transformacion_visualizacion.ipynb
      - Back/reports/dod_status.json
    nota: QA marcó gráficos sin interpretación (c46, c51, c56).

  - id: HU-05
    epica: E-04
    rol: científico de datos
    quiero: entrenar y comparar modelos clásicos con validación cruzada en train
    para: tener una referencia sólida y una selección sin fuga
    criterios_aceptacion:
      - dado: Dummy, LR, árbol, RF y HGB
        cuando: se evalúan con CV estratificada de 5 folds en train
        entonces: se reportan ROC-AUC, PR-AUC, KS, Brier y F1 con las mismas métricas para todos
      - dado: el notebook 05 ejecutado
        cuando: termina
        entonces: existe Back/models/resultados_clasicos.json y el mejor modelo supera a la línea base
    puntos: 5
    sprint: S6
    sprint_mvp: S3
    estado: Hecho
    paso: 5
    ids_enunciado: [F3, IA3.3, R2]
    evidencia:
      - Back/notebooks/05_modelos_clasicos.ipynb
      - Back/models/resultados_clasicos.json
    nota: En el MVP el nb05 tenía 0 celdas ejecutadas.

  - id: HU-06
    epica: E-04
    rol: científico de datos
    quiero: entrenar una CNN 1D y una RNN (GRU) en TensorFlow/Keras
    para: comparar Deep Learning con los modelos clásicos
    criterios_aceptacion:
      - dado: TensorFlow 2.20 instalado (ADR-006)
        cuando: se ejecuta el notebook 06
        entonces: MLP, CNN 1D y GRU se entrenan con class_weight y EarlyStopping y se evalúan en test
      - dado: el notebook 06 ejecutado
        cuando: se revisan los artefactos
        entonces: existen red_neuronal.keras, resultados_dl.json con historiales y la tabla clásicos vs DL con tiempos
    puntos: 8
    sprint: S6
    sprint_mvp: S3
    estado: Hecho
    paso: 6
    ids_enunciado: [IA3.2, IA3.E2, IA3.3, F3, R2]
    evidencia:
      - Back/src/credit_risk/dl.py
      - Back/notebooks/06_red_neuronal.ipynb
      - Back/models/resultados_dl.json
      - Back/models/red_neuronal.keras
    nota: En el MVP no se entrenó ninguna red y la conclusión afirmaba lo contrario.

  - id: HU-07
    epica: E-04
    rol: analista de crédito
    quiero: que el texto de la solicitud aporte a la evaluación del riesgo
    para: aprovechar la información no estructurada
    criterios_aceptacion:
      - dado: los 4.454 textos únicos
        cuando: se ejecuta el notebook 07
        entonces: hay frecuencias, n-gramas, TF-IDF+LR, sentimiento con BERT y embeddings sentence-transformers vs GPT-2 en 2D
      - dado: el modelo combinado
        cuando: se compara con el tabular
        entonces: se reporta ΔAUC con IC bootstrap y existen resultados_nlp.json y nlp_features.parquet
    puntos: 8
    sprint: S6
    sprint_mvp: S3
    estado: Hecho
    paso: 7
    ids_enunciado: [IA3.1, IA3.E1, F3, R2]
    evidencia:
      - Back/src/credit_risk/nlp.py
      - Back/src/credit_risk/nlp_avanzado.py
      - Back/notebooks/07_nlp_riesgo.ipynb
      - Back/models/resultados_nlp.json
      - db/processed/nlp_features.parquet
    nota: En el MVP el nb07 tenía 19 celdas sin ejecutar.

  - id: HU-08
    epica: E-05
    rol: analista de crédito
    quiero: un modelo final calibrado, con umbrales justificados por costo y auditado en equidad
    para: tomar decisiones justas, explicables y confiables
    criterios_aceptacion:
      - dado: las predicciones OOF y de test guardadas por train.py
        cuando: se ejecuta el notebook 08
        entonces: no reentrena y sus métricas coinciden con model_card.json (lo verifica un test)
      - dado: el notebook 08
        cuando: se revisa
        entonces: muestra calibración, curva de costo con sensibilidad, tabla final de modelos, equidad antes/después, SHAP global, 3 casos y PSI train/test
    puntos: 8
    sprint: S7
    sprint_mvp: S3
    estado: Hecho
    paso: 8
    ids_enunciado: [F4, IA1.3, IA3.3, R1]
    evidencia:
      - Back/notebooks/08_evaluacion_optimizacion.ipynb
      - Back/models/modelo_final.joblib
      - Back/models/model_card.json
      - Back/models/oof_predictions.parquet
      - Back/models/test_predictions.parquet
    nota: En el MVP el modelo servido (v1.0.0, umbral 0,4396) no era el del nb08 (0,25).

  - id: HU-09
    epica: E-06
    rol: científico de datos
    quiero: procesar y modelar los datos con PySpark
    para: demostrar que la solución escala a grandes volúmenes
    criterios_aceptacion:
      - dado: el contenedor quay.io/jupyter/pyspark-notebook:2026-10-19 (ADR-005)
        cuando: se ejecuta el notebook 09 con docker-compose.spark.yml
        entonces: usa esquema explícito, transformaciones, Spark SQL y escribe Parquet particionado
      - dado: el notebook 09 ejecutado
        cuando: se revisa resultados_spark.json
        entonces: contiene el AUC de MLlib comparado con sklearn y la versión de Spark
    puntos: 5
    sprint: S6
    sprint_mvp: S4
    estado: Hecho
    paso: 9
    ids_enunciado: [IA3.6]
    evidencia:
      - Back/notebooks/09_spark_big_data.ipynb
      - Back/docker-compose.spark.yml
      - Back/models/resultados_spark.json
    nota: En el MVP el nb09 corrió con respaldo pandas/pyarrow, sin PySpark.

  - id: HU-10
    epica: E-07
    rol: sistema de originación del banco
    quiero: consumir el modelo servido por una API REST
    para: integrar la decisión aprobar/revisar/rechazar en el proceso de crédito
    criterios_aceptacion:
      - dado: la API v2 con el modelo cargado en lifespan
        cuando: se envía el cliente demo de riesgo bajo a /predict
        entonces: responde banda Bajo y decisión aprobar, con contribuciones y la versión 2.0.0
      - dado: una petición con un campo inválido
        cuando: se envía a /predict
        entonces: responde 422 marcando el campo
      - dado: el repositorio
        cuando: se ejecuta python -m pytest Back/tests/test_api.py
        entonces: todas las pruebas pasan
    puntos: 5
    sprint: S7
    sprint_mvp: S4
    estado: Hecho
    paso: 10
    ids_enunciado: [IA3.4, IA3.E3, R4, F5]
    evidencia:
      - Back/api/main.py
      - Back/api/schemas.py
      - Back/api/service.py
      - Back/tests/test_api.py
      - Back/models/model_card.json
    nota: Código v2 escrito, pendiente de pruebas con el modelo v2.0.0.

  - id: HU-11
    epica: E-08
    rol: docente evaluador
    quiero: un notebook final integrador y un informe ejecutivo
    para: evaluar el proyecto completo en un solo recorrido
    criterios_aceptacion:
      - dado: el notebook 00 ejecutado
        cuando: se revisa
        entonces: usa el pipeline de credit_risk y el modelo servido, predice 3 clientes (bajo, medio, alto) y llama a la API con TestClient
      - dado: el informe 06
        cuando: se compara con model_card.json
        entonces: todas sus cifras coinciden con la card v2.0.0
    puntos: 5
    sprint: S8
    sprint_mvp: S4
    estado: Hecho
    paso: 11
    ids_enunciado: [PF1, E2, E4, F5]
    evidencia:
      - Back/notebooks/00_proyecto_integrador_final.ipynb
      - docs/06_informe_resultados.md
      - Back/reports/dod_status.json
    nota: En el MVP el nb00 tenía flujo propio y umbral 0,24.

  - id: HU-12
    epica: E-07
    rol: equipo del proyecto
    quiero: lanzar todo en local con comandos documentados desde un clon limpio
    para: demostrar que la solución funciona sin pasos ocultos
    criterios_aceptacion:
      - dado: un clon limpio en otra carpeta
        cuando: se siguen los comandos de Back/README.md
        entonces: se instala el entorno, pasan los tests y /health responde 200
      - dado: la API levantada en un puerto libre verificado
        cuando: se envía el ejemplo de Back/api/ejemplo_request.json a /predict
        entonces: devuelve probabilidad, banda y decisión
    puntos: 3
    sprint: S8
    sprint_mvp: S4
    estado: Hecho
    paso: 12
    ids_enunciado: [R1, R4]
    evidencia:
      - Back/README.md
      - Back/api/ejemplo_request.json
    nota: En el MVP se marcó Hecho sin prueba desde clon limpio.

  # ---------------------------------------------------------------- HU nuevas de v2
  - id: HU-13
    epica: E-09
    rol: científico de datos
    quiero: un único paquete instalable credit_risk con toda la lógica
    para: que notebooks, train.py, API y exportador usen exactamente el mismo código
    criterios_aceptacion:
